name: Build and Push Docker Image

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]

env:
  GHCR: ghcr.io/trackit-systems
  ZOT_REGISTRY: registry.trackit.systems

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tag.outputs.tags }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get tag name
      id: tag
      # Docker tags allow only [A-Za-z0-9_.-] (max 128 chars), so branch names
      # like "feature/foo" are sanitized to "feature-foo".
      # Only release tags move "latest": tag pushes whose name has no "-"
      # (so test/pre-release tags like 0.0.0-registry-test don't).
      run: |
        tag=$(echo "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
        tags="$tag"
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
          tags="$tags latest"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "tags=$tags" >> "$GITHUB_OUTPUT"

    - name: Set image tags
      id: image
      env:
        IMAGE: ${{ env.GHCR }}/${{ github.event.repository.name }}
        TAGS: ${{ steps.tag.outputs.tags }}
      run: |
        {
          echo "refs<<EOF"
          for t in $TAGS; do echo "$IMAGE:$t"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.image.outputs.refs }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          SONARI_FOLDER=${{ vars.SONARI_FOLDER || '/sonari' }}
          NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.tag }}
        provenance: false
        sbom: false

    - name: Output image details
      env:
        REFS: ${{ steps.image.outputs.refs }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        echo "Images pushed to:"
        for r in $REFS; do echo "  - $r"; done
        echo "Image digest: $DIGEST"

  # Copies the ghcr image to zot by digest. Nothing depends on this job: when
  # zot is slow or down it fails visibly, and repair-zot.yml fixes it later.
  zot-copy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to ZOT Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ZOT_REGISTRY }}
        username: ${{ secrets.ZOT_ROBOT_USER }}
        password: ${{ secrets.ZOT_ROBOT_TOKEN }}

    - name: Copy to zot and check digests
      env:
        IMG: ${{ github.event.repository.name }}
        DIGEST: ${{ needs.build-and-push.outputs.digest }}
        TAGS: ${{ needs.build-and-push.outputs.tags }}
      run: |
        set -euo pipefail
        src="ghcr.io/trackit-systems/${IMG}@${DIGEST}"
        for t in $TAGS; do
          for delay in 30 120 300 end; do
            docker buildx imagetools create --prefer-index=false -t "registry.trackit.systems/backend/${IMG}:${t}" "$src" && break
            [ "$delay" = end ] && { echo "::error::copy to zot failed for ${t}"; exit 1; }
            echo "retry in ${delay}s"; sleep "$delay"
          done
        done
        for t in $TAGS; do
          for ref in "ghcr.io/trackit-systems/${IMG}:${t}" "registry.trackit.systems/backend/${IMG}:${t}"; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$ref is $got, expected $DIGEST"; exit 1; }
          done
        done
