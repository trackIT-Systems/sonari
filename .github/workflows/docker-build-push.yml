name: Build and Push Docker Image

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]

env:
  REGISTRY: registry.trackit.systems

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ZOT Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ZOT_ROBOT_USER }}
        password: ${{ secrets.ZOT_ROBOT_TOKEN }}

    - name: Get tag name
      id: tag
      # Docker tags allow only [A-Za-z0-9_.-] (max 128 chars), so branch names
      # like "feature/foo" are sanitized to "feature-foo".
      run: |
        tag=$(echo "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
        echo "tag=$tag" >> $GITHUB_OUTPUT

    - name: Set image tags
      id: image
      run: |
        image="${{ env.REGISTRY }}/backend/${{ github.event.repository.name }}"
        echo "tag_name=$image:${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
        # Only release tags move "latest"; branch builds get their branch tag only.
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "latest_name=$image:latest" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.image.outputs.tag_name }}
          ${{ steps.image.outputs.latest_name }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          SONARI_FOLDER=${{ vars.SONARI_FOLDER || '/sonari' }}
          NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.tag }}
        provenance: false
        sbom: false

    - name: Output image details
      run: |
        echo "Images pushed to:"
        echo "  - ${{ steps.image.outputs.tag_name }}"
        if [ -n "${{ steps.image.outputs.latest_name }}" ]; then echo "  - ${{ steps.image.outputs.latest_name }}"; fi
        echo "Image digest: ${{ steps.build.outputs.digest }}"
        echo "Git tag used: ${{ steps.tag.outputs.tag }}"