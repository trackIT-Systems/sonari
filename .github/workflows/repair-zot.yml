name: Repair zot copy

# Copies an image tag from ghcr to zot again, e.g. after zot was down during
# a build. ghcr is the source of truth; the copy is by digest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to copy from ghcr to zot
        required: true
        type: string
      move_latest:
        description: Also point zot's "latest" at this tag (only for the newest release)
        required: false
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to ZOT Registry
      uses: docker/login-action@v3
      with:
        registry: registry.trackit.systems
        username: ${{ secrets.ZOT_ROBOT_USER }}
        password: ${{ secrets.ZOT_ROBOT_TOKEN }}

    - name: Copy to zot and check digests
      env:
        IMG: ${{ github.event.repository.name }}
        TAG: ${{ inputs.tag }}
        MOVE_LATEST: ${{ inputs.move_latest }}
      run: |
        set -euo pipefail
        DIGEST=$(docker buildx imagetools inspect "ghcr.io/trackit-systems/${IMG}:${TAG}" --format '{{.Manifest.Digest}}')
        [[ "$DIGEST" == sha256:* ]] || { echo "::error::no digest for ghcr.io/trackit-systems/${IMG}:${TAG}"; exit 1; }
        echo "ghcr.io/trackit-systems/${IMG}:${TAG} is ${DIGEST}"
        TAGS="$TAG"
        if [ "$MOVE_LATEST" = true ]; then TAGS="$TAGS latest"; fi
        src="ghcr.io/trackit-systems/${IMG}@${DIGEST}"
        for t in $TAGS; do
          for delay in 30 120 300 end; do
            docker buildx imagetools create --prefer-index=false -t "registry.trackit.systems/backend/${IMG}:${t}" "$src" && break
            [ "$delay" = end ] && { echo "::error::copy to zot failed for ${t}"; exit 1; }
            echo "retry in ${delay}s"; sleep "$delay"
          done
        done
        for t in $TAGS; do
          for ref in "ghcr.io/trackit-systems/${IMG}:${t}" "registry.trackit.systems/backend/${IMG}:${t}"; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$ref is $got, expected $DIGEST"; exit 1; }
          done
        done
